name: Production checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      PORT: "4000"
      DATABASE_URL: postgresql://user:password@localhost:5432/game_platform?schema=public
      DIRECT_URL: postgresql://user:password@localhost:5432/game_platform?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      CLIENT_URL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      VITE_API_URL: https://api.example.com
      VITE_SOCKET_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
